name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-22.04
            artifact: minecraftspeedproxy-ubuntu-amd64.tar.gz

          - os: debian
            runner: ubuntu-latest
            container: debian:12
            artifact: minecraftspeedproxy-debian12-amd64.tar.gz

    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            git \
            ca-certificates \
            zlib1g-dev \
            libssl-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p minecraftspeedproxy
          cp build/minecraftspeedproxy minecraftspeedproxy/
          cp LICENSE minecraftspeedproxy/
          tar -czf "${{ matrix.artifact }}" minecraftspeedproxy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.artifact }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Downloads

            - Ubuntu
            - Debian 12
          files: ${{ matrix.artifact }}
